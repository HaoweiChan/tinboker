# Multi-Environment Docker Compose
# Runs all three environments (prod, dev, staging) simultaneously
#
# Usage:
#   docker compose -f docker-compose.multi.yml up -d
#   docker compose -f docker-compose.multi.yml restart backend-prod
#   docker compose -f docker-compose.multi.yml pull backend-prod && docker compose -f docker-compose.multi.yml up -d --no-deps backend-prod

# Container log rotation. Without it, json-file logs grow without bound until a
# deploy happens to recycle the container — backend-dev reached 18 GB over 12 days
# and was only reclaimed by luck.
#
# Set per-service rather than in /etc/docker/daemon.json because daemon.json needs a
# `systemctl restart docker`, which bounces prod, staging and dev simultaneously.
# These apply when each container is next recreated, which normal deploys already do.
#
# logrotate is NOT a substitute: it can only rotate these by copytruncate (dockerd
# holds the inode open), and external truncation leaves the json-file driver with a
# stale offset — `docker logs --tail N` then returns nothing until the container is
# recreated. Verified on this host. Docker's own rotation has no such problem.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # Production Backend - Port 8000
  backend-prod:
    image: ghcr.io/haoweichan/tinboker-backend:${PROD_IMAGE_TAG:-main}
    container_name: tinboker-backend-prod
    logging: *default-logging
    # Bind to loopback only: Caddy proxies from the host/Docker network, so the public
    # internet must NOT reach the origin directly (that bypasses Cloudflare's WAF/DDoS).
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: production
      USE_POSTGRES: "true"
      # P1 read flip (firestore-contract §11): content reads from the local
      # firestore_mirror. Verified on dev 2026-08-03 (parity vs Firestore).
      CONTENT_READS_FROM_POSTGRES: "true"
      # Each env gets its own Redis logical DB so dev/staging test data can never
      # bleed into (or evict) production's cache. prod=/0, staging=/1, dev=/2.
      REDIS_URL: redis://redis:6379/0
      PORT: "8000"
      HOST: 0.0.0.0
      GCP_PROJECT_ID: gen-lang-client-0901363254
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-service-account.json
      GCP_CREDENTIALS_PATH: /app/gcp-service-account.json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: podcast_db
      POSTGRES_USER: podcast_user
      FIRESTORE_DATABASE_ID: graphfolio-db
      RELEASE_EPISODE_MAX_AGE_DAYS: "60"
      TAXONOMY_REQUIRE_MEMBER_REASONS: "true"
      # Threads/Facebook auto-posting, TW time. PRODUCTION ONLY: all three envs load the
      # same publishing tokens from GSM, so a second env with this set would double-post.
      # Ingest keeps its own 02/08/14/20:10 timer — posting no longer rides on it.
      SOCIAL_PUBLISH_SLOTS: "11:30,15:30,20:30"
      # Comment triage on the same production-only rule. Only "praise" replies go out
      # unattended; anything with a factual claim, a question or a position lands in
      # the admin 留言 tab for a human.
      SOCIAL_COMMENT_SYNC_MINUTES: "30"
      CORS_ORIGINS: '["https://tinboker.com","https://www.tinboker.com"]'
      # Marp render service runs as separate infra on its own docker network, only
      # reachable via its host-published :5004 — so go through the host gateway.
      MARP_SERVICE_URL: http://host.docker.internal:5004
      # P5 (firestore-contract § 11.7): episode media artifacts live on the VPS disk,
      # not GCS. Path inside the container; the host dir is bind-mounted rw below.
      MEDIA_STORAGE_ROOT: /srv/tinboker-media
      MEDIA_PUBLIC_BASE: https://podcast-api.tinboker.com/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./gcp-service-account.json:/app/gcp-service-account.json:ro
      # rw: the backend writes modified summaries, social-card PNGs and promo media here.
      - /srv/tinboker-media:/srv/tinboker-media:rw
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  # Development Backend - Port 8001
  backend-dev:
    image: ghcr.io/haoweichan/tinboker-backend:${DEV_IMAGE_TAG:-develop}
    container_name: tinboker-backend-dev
    logging: *default-logging
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      ENVIRONMENT: development
      USE_POSTGRES: "true"
      # P1 read flip (firestore-contract §11): content reads from the local
      # firestore_mirror instead of Firestore. Dev first; staging/prod after soak.
      CONTENT_READS_FROM_POSTGRES: "true"
      REDIS_URL: redis://redis:6379/2
      PORT: "8000"
      HOST: 0.0.0.0
      GCP_PROJECT_ID: gen-lang-client-0901363254
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-service-account.json
      GCP_CREDENTIALS_PATH: /app/gcp-service-account.json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: podcast_db
      POSTGRES_USER: podcast_user
      FIRESTORE_DATABASE_ID: graphfolio-db
      RELEASE_EPISODE_MAX_AGE_DAYS: "60"
      TAXONOMY_REQUIRE_MEMBER_REASONS: "true"
      CORS_ORIGINS: '["https://dev.tinboker.com","http://localhost:5173","http://localhost:3000"]'
      MARP_SERVICE_URL: http://host.docker.internal:5004
      # P5 (firestore-contract § 11.7): episode media artifacts live on the VPS disk,
      # not GCS. Path inside the container; the host dir is bind-mounted rw below.
      MEDIA_STORAGE_ROOT: /srv/tinboker-media
      MEDIA_PUBLIC_BASE: https://podcast-api.tinboker.com/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./gcp-service-account.json:/app/gcp-service-account.json:ro
      # rw: the backend writes modified summaries, social-card PNGs and promo media here.
      - /srv/tinboker-media:/srv/tinboker-media:rw
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  # Staging Backend - Port 8002
  backend-staging:
    image: ghcr.io/haoweichan/tinboker-backend:${STAGING_IMAGE_TAG:-develop}
    container_name: tinboker-backend-staging
    logging: *default-logging
    ports:
      - "127.0.0.1:8002:8000"
    environment:
      ENVIRONMENT: staging
      USE_POSTGRES: "true"
      CONTENT_READS_FROM_POSTGRES: "true"
      REDIS_URL: redis://redis:6379/1
      PORT: "8000"
      HOST: 0.0.0.0
      GCP_PROJECT_ID: gen-lang-client-0901363254
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-service-account.json
      GCP_CREDENTIALS_PATH: /app/gcp-service-account.json
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: podcast_db
      POSTGRES_USER: podcast_user
      FIRESTORE_DATABASE_ID: graphfolio-db
      RELEASE_EPISODE_MAX_AGE_DAYS: "60"
      TAXONOMY_REQUIRE_MEMBER_REASONS: "true"
      CORS_ORIGINS: '["https://tinboker.com","https://dev.tinboker.com","https://staging.tinboker.com","http://localhost:5173","http://localhost:3000"]'
      MARP_SERVICE_URL: http://host.docker.internal:5004
      # P5 (firestore-contract § 11.7): episode media artifacts live on the VPS disk,
      # not GCS. Path inside the container; the host dir is bind-mounted rw below.
      MEDIA_STORAGE_ROOT: /srv/tinboker-media
      MEDIA_PUBLIC_BASE: https://podcast-api.tinboker.com/media
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./gcp-service-account.json:/app/gcp-service-account.json:ro
      # rw: the backend writes modified summaries, social-card PNGs and promo media here.
      - /srv/tinboker-media:/srv/tinboker-media:rw
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  # Shared Postgres
  postgres:
    image: postgres:16-alpine
    container_name: tinboker-postgres
    logging: *default-logging
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: podcast_user
      POSTGRES_DB: podcast_db
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in backend/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podcast_user -d podcast_db"]
      # Same exec-churn reasoning as redis below.
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s

  # Shared Redis
  redis:
    image: redis:7-alpine
    container_name: tinboker-redis
    logging: *default-logging
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly no --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      # Every healthcheck is a `docker exec`: a fresh process + namespace + cgroup that
      # dockerd and containerd must set up and tear down. At 10s this one alone was the
      # most frequent exec on the host. 30s steady-state, with start_interval keeping
      # `depends_on: service_healthy` fast on a cold start.
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s

  # Shared Netdata Monitoring
  netdata:
    image: netdata/netdata:stable
    container_name: tinboker-netdata
    logging: *default-logging
    hostname: tinboker-vps
    ports:
      - "127.0.0.1:19999:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - NETDATA_CLAIM_TOKEN=
      - DOCKER_HOST=/var/run/docker.sock
      - NETDATA_DISABLE_TELEMETRY=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:19999/api/v1/info"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  redis-data:
  postgres-data:
  netdataconfig:
  netdatalib:
  netdatacache:

networks:
  default:
    name: app_default
    external: true
