[project]
name = "tinboker-backend"
version = "0.4.14"
description = "TinBoker platform backend API (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.104.1",
    "finmind>=1.9.2",
    "firebase-admin>=6.0.0",
    "httpx==0.25.2",
    "massive>=2.0.3",
    "pandas>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic[email]==2.5.0",
    "pydantic-settings>=2.1.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart==0.0.6",
    "redis[hiredis]>=5.0.0",
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "tqdm>=4.67.1",
    "uvicorn[standard]==0.24.0",
    "yfinance>=0.2.66",
    "google-auth>=2.23.0",
    "google-cloud-secret-manager>=2.16.0",
]

# CI installs ruff unpinned, so the rule set must be pinned here instead — otherwise a
# new ruff release that widens the defaults turns every backend PR red overnight (which
# is exactly what 0.16.0 did). Mirrors how pipelines/pyproject.toml already does it.
# These are ruff's pre-0.16 defaults minus the flags backend-ci.yml used to pass inline.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501", "E722", "E701", "E402", "F841"]
