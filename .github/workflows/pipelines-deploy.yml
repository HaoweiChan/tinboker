name: Pipelines Deploy

on:
  push:
    branches: [develop, main]
    paths:
      - 'pipelines/**'
      - '.github/workflows/pipelines-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # P6: secrets come from GitHub Actions repo secrets, not GSM. Same names as the
      # old GSM secrets — see docs/firestore-contract.md §11.8 for the migration map.
      - name: Load deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          echo "::add-mask::$VPS_HOST"
          echo "::add-mask::$VPS_USER"
          echo "::add-mask::$VPS_SSH_KEY"

          echo "VPS_HOST=$VPS_HOST" >> $GITHUB_ENV
          echo "VPS_USER=$VPS_USER" >> $GITHUB_ENV

          echo "VPS_SSH_KEY<<EOFKEY" >> $GITHUB_ENV
          echo "$VPS_SSH_KEY" >> $GITHUB_ENV
          echo "EOFKEY" >> $GITHUB_ENV

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ env.VPS_SSH_KEY }}
          script: |
            set -e
            MONOREPO_DIR="/root/tinboker"
            REPO_DIR="$MONOREPO_DIR/pipelines"
            PODCAST_DIR="$REPO_DIR/services/podcast"
            SA_FILE="$PODCAST_DIR/gcp-service-account.json"
            
            # 1. Clone or pull the monorepo
            if [ -d "$MONOREPO_DIR/.git" ]; then
                echo "→ Pulling latest changes..."
                cd "$MONOREPO_DIR"
                # --force so a diverged local tag on the VPS can't abort the
                # fetch with "would clobber existing tag" and skip the deploy.
                git fetch origin --tags --force
                if [[ "${{ github.ref }}" == refs/tags/* ]]; then
                  git checkout -f "${{ github.ref_name }}"
                else
                  git checkout -f "origin/${{ github.ref_name }}"
                fi
            else
                echo "→ Cloning repository..."
                git clone https://github.com/HaoweiChan/tinboker.git "$MONOREPO_DIR"
                cd "$MONOREPO_DIR"
                if [[ "${{ github.ref }}" == refs/tags/* ]]; then
                  git checkout -f "${{ github.ref_name }}"
                else
                  git checkout -f "origin/${{ github.ref_name }}"
                fi
            fi
            
            # 2. uv sync
            cd "$REPO_DIR"
            if ! command -v uv >/dev/null 2>&1; then
                echo "→ Installing uv..."
                curl -LsSf https://astral.sh/uv/install.sh | sh
                export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
            fi
            echo "→ Syncing dependencies..."
            uv sync --package tinboker-podcast --package tinboker-news
            
            # 3. Service Account Credentials
            if [ ! -f "$SA_FILE" ]; then
                if [ -f "/root/gcp-sa-backup.json" ]; then
                    cp /root/gcp-sa-backup.json "$SA_FILE"
                    chmod 600 "$SA_FILE"
                    echo "→ Copied GCP service account from backup"
                else
                    echo "ERROR: No GCP service account found at $SA_FILE or /root/gcp-sa-backup.json"
                    exit 1
                fi
            fi

            # 4. Write/refresh the systemd units
            echo "→ Installing systemd service for podcast-api..."
            cat > /etc/systemd/system/podcast-api.service << 'EOF'
            [Unit]
            Description=Tinboker Podcast API (LangGraph Pipeline + Wiki API)
            After=network.target postgresql.service

            [Service]
            Type=simple
            WorkingDirectory=/root/tinboker/pipelines/services/podcast
            ExecStart=/root/tinboker/pipelines/.venv/bin/uvicorn app:app --host 0.0.0.0 --port 8003
            Restart=always
            RestartSec=5
            # P6: pipeline secrets come from this env file. Leading "-" = optional, so
            # the unit still starts before the operator has created it and
            # shared.secrets falls back to GSM. KEY=value per line — format documented
            # in pipelines/libs/shared/src/shared/secrets.py. Listed FIRST so the
            # pinned Environment= constants below still win.
            EnvironmentFile=-/root/tinboker/pipelines/.env
            Environment=PORT=8003
            # Still required: the article store reads GCS with this service account.
            Environment=GOOGLE_APPLICATION_CREDENTIALS=/root/tinboker/pipelines/services/podcast/gcp-service-account.json
            # content_builder LLM model — the default for every role (extractor,
            # writer, marp, ticker, key-insights); social_copy_writer is pinned
            # separately below. To switch the rest, change just this line (or the admin
            # config plane, which overrides it without a redeploy). The weak per-role gemini pins
            # that used to live here mislabelled long chitchat (e.g. a red-wine tangent)
            # as "analysis", so the segment filter kept it — deepseek-v4-pro types it
            # correctly. A per-role override is still possible via e.g. WRITER_MODEL=.
            Environment=PIPELINE_LLM_MODEL=openrouter:deepseek/deepseek-v4-pro
            # The one per-role pin. The Threads copy is the only output judged on voice
            # rather than accuracy, and deepseek keeps breaking that prompt's rules:
            # 翻案句 ("不是A是B") three times per post, metaphor pile-ups, and one run
            # that came back in 简体 — a hard fail on the prompt's first rule. Measured
            # on 股癌 EP687, 3 runs each: gemini and sonnet tied on rule compliance;
            # gemini's register is more colloquial TW, it never lifted the prompt's own
            # example opening, it kept the comment headings intact (the admin editor
            # aligns them to the carousel cards), and it costs ~1/5 of sonnet per run.
            # Every other role stays on deepseek.
            Environment=SOCIAL_COPY_WRITER_MODEL=openrouter:google/gemini-3.7-flash
            # extractor pinned to flash: it is the ONLY role that receives {sentences} (the raw
            # transcript), so it alone accounts for the bulk of prompt-token spend — 30 days of
            # v4-pro was 175M prompt tokens, 84% of the whole OpenRouter bill. Measured on 4
            # episodes (537 / 800 / 1102 / 2732 sentences), flash-0731 matched v4-pro on every
            # correctness axis that matters here — 100% sentence coverage, no out-of-range index
            # ranges, no off-vocabulary segment_type, no simplified glyphs — and consolidate_chapters
            # normalised the higher raw event count to the SAME chapter count (4 vs 4, 8 vs 8),
            # because _target_chapter_count is driven by duration, not by how finely the extractor
            # split. Cost per episode fell 93-98%. The 2026-06 bake-off that chose v4-pro judged
            # tag vocabulary and ticker linking — both the writer's and ticker_extractor's job, on
            # {events}, not the transcript — so the role burning the tokens was never the one the
            # decision was about. Those roles stay on v4-pro via PIPELINE_LLM_MODEL above.
            Environment=EXTRACTOR_MODEL=openrouter:deepseek/deepseek-v4-flash-0731
            # Use the platform source-of-truth show list (same as run_nightly.sh).
            Environment=TINBOKER_PLATFORM_API_URL=https://api.tinboker.com
            # /api/admin/* is not mounted in production by design; staging shares the DB.
            Environment=TINBOKER_ADMIN_API_URL=https://staging-api.tinboker.com

            [Install]
            WantedBy=multi-user.target
            EOF
            
            echo "→ Installing systemd services for tinboker-news..."
            chmod +x "$REPO_DIR/services/news/scripts/run_news.sh"
            cp "$REPO_DIR/services/news/deploy/tinboker-news.service" /etc/systemd/system/tinboker-news.service
            cp "$REPO_DIR/services/news/deploy/tinboker-news.timer" /etc/systemd/system/tinboker-news.timer

            echo "→ Installing the podcast ingest timer..."
            chmod +x "$REPO_DIR/services/podcast/scripts/run_scheduled_ingest.sh"
            cp "$REPO_DIR/services/podcast/deploy/tinboker-podcast-ingest.service" /etc/systemd/system/tinboker-podcast-ingest.service
            cp "$REPO_DIR/services/podcast/deploy/tinboker-podcast-ingest.timer" /etc/systemd/system/tinboker-podcast-ingest.timer
            
            systemctl daemon-reload
            
            echo "→ Restarting podcast-api..."
            systemctl enable podcast-api
            systemctl restart podcast-api
            
            echo "→ Restarting tinboker-news.timer..."
            systemctl enable --now tinboker-news.timer

            # enable --now arms the timer without running the ingest; the unit is
            # oneshot and fires on its own schedule.
            echo "→ Arming tinboker-podcast-ingest.timer..."
            systemctl enable --now tinboker-podcast-ingest.timer
            systemctl list-timers tinboker-podcast-ingest.timer --no-pager || true
            
            echo "→ Waiting for service to start..."
            sleep 5
            
            # 5. Health checks
            if curl -sf http://localhost:8003/health > /dev/null 2>&1; then
                echo "✓ Podcast API is healthy on port 8003"
            else
                echo "✗ Health check failed. Check: journalctl -u podcast-api -n 50"
                systemctl status podcast-api --no-pager
                exit 1
            fi
            
            curl -s http://localhost:8003/api/wiki/health || true
            echo ""

            # 6. Cleanup legacy directories
            echo "→ Removing stale /root/tinboker-agents..."
            rm -rf /root/tinboker-agents
